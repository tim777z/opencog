# Keep the build and the security tooling current.
#
# The native dependencies (cogutils, atomspace) are not package-manager
# managed -- they are built from source and pinned in the Dockerfile and
# Makefile -- so Dependabot watches the GitHub Actions pins, the Python
# requirements and the container base image instead.
version: 2

updates:
  # Pinning a CI action to a mutable tag (`@v4`) is how the CI supply chain
  # gets compromised. Dependabot keeps them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    labels:
      - dependencies
      - ci
      - security

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    # requirements.lock.txt is generated by `make lock`; Dependabot updates
    # the input file and the lock is regenerated in the same PR by CI.
    ignore:
      - dependency-name: "pip"
      - dependency-name: "setuptools"
      - dependency-name: "wheel"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
      - security
